<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trash Panda Heist</title>
<meta name="description" content="Fling trash, dodge the night crew, and raid the dumpster.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1230;
    --panel: rgba(24, 22, 40, 0.94);
    --ink: #f4ecdf;
    --gold: #f2c14e;
    --red: #ef5b4c;
    --green: #3fa66a;
    --display: "Luckiest Guy", "Trebuchet MS", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    overflow: hidden; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #wrap { position: fixed; inset: 0; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  #hud { position: absolute; inset: 0; pointer-events: none; }
  #status {
    position: absolute; top: 10px; left: 10px; padding: 8px 12px; border-radius: 12px;
    background: rgba(14, 12, 26, 0.72); border: 2px solid #17131f; min-width: 150px;
    font-size: clamp(11px, 1.3vw, 14px); line-height: 1.5;
  }
  #lvl { font-family: var(--display); font-size: clamp(14px, 1.8vw, 20px); color: var(--gold); letter-spacing: 0.5px; }
  #hearts { font-size: clamp(16px, 2vw, 22px); letter-spacing: 3px; color: var(--red); line-height: 1.1; }
  #hearts .off { color: rgba(255, 255, 255, 0.2); }
  #center {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(46%, 420px);
  }
  #banner {
    font-family: var(--display); font-size: clamp(15px, 2.4vw, 28px); letter-spacing: 1px;
    padding: 4px 14px; border-radius: 10px; border: 2px solid #17131f; white-space: nowrap; visibility: hidden;
  }
  #banner.warn { visibility: visible; background: var(--gold); color: #2a1d05; }
  #banner.danger { visibility: visible; background: var(--red); color: #fff; animation: pulse 0.35s infinite alternate; }
  #banner.safe { visibility: visible; background: var(--green); color: #fff; }
  #banner.calm { visibility: visible; background: rgba(14, 12, 26, 0.72); color: var(--ink); }
  @keyframes pulse { to { transform: scale(1.07); } }
  #watch {
    width: 100%; height: 10px; border-radius: 6px; background: rgba(14, 12, 26, 0.72);
    border: 2px solid #17131f; overflow: hidden; visibility: hidden;
  }
  #watch.on { visibility: visible; }
  #watchBar { display: block; height: 100%; width: 0; background: var(--red); }
  #ammo {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); text-align: center;
    padding: 6px 14px; border-radius: 12px; background: rgba(14, 12, 26, 0.72); border: 2px solid #17131f;
    font-size: clamp(11px, 1.3vw, 14px); line-height: 1.45; max-width: 64%;
  }
  #ammo b { color: var(--gold); }
  #hint { opacity: 0.8; }

  #topBtns { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; }
  .small {
    font: 600 13px system-ui, sans-serif; padding: 8px 12px; border-radius: 10px;
    border: 2px solid #17131f; background: rgba(14, 12, 26, 0.72); color: var(--ink); cursor: pointer;
  }
  .small:hover { background: rgba(50, 44, 80, 0.9); }
  #hideBtn {
    position: absolute; left: 14px; bottom: 14px;
    width: clamp(68px, 9vw, 108px); height: clamp(68px, 9vw, 108px); border-radius: 50%;
    background: var(--green); border: 3px solid #17131f; color: #fff;
    font-family: var(--display); font-size: clamp(16px, 2vw, 24px); letter-spacing: 1px;
    cursor: pointer; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  }
  #hideBtn small { font: 600 10px system-ui, sans-serif; opacity: 0.85; margin-top: 4px; letter-spacing: 0; }
  #hideBtn.active { background: var(--gold); color: #2a1d05; }

  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(8, 6, 18, 0.55); padding: 16px;
  }
  #overlay.show { display: flex; }
  .panel {
    background: var(--panel); border: 3px solid var(--gold); border-radius: 18px;
    padding: clamp(14px, 2.4vw, 26px) clamp(16px, 3vw, 32px); max-width: min(580px, 100%);
    text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); max-height: 100%; overflow: auto;
  }
  .panel h1 {
    font-family: var(--display); color: var(--gold); font-weight: 400;
    font-size: clamp(26px, 4.6vw, 50px); margin: 0 0 8px; letter-spacing: 1px;
  }
  .panel p { margin: 6px 0; font-size: clamp(12px, 1.6vw, 16px); line-height: 1.45; }
  .panel .stars { font-size: clamp(26px, 4vw, 40px); color: var(--gold); letter-spacing: 6px; margin: 4px 0; }
  .panel .stars .off { color: rgba(255, 255, 255, 0.18); }
  .panel .row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .panel button {
    font-family: var(--display); font-size: clamp(16px, 2vw, 22px); letter-spacing: 1px;
    padding: 10px 22px; border-radius: 12px; border: 0; cursor: pointer; background: var(--gold); color: #2a1d05;
  }
  .panel button.alt { background: rgba(255, 255, 255, 0.12); color: var(--ink); }
  .panel button:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="status">
      <div id="lvl"></div>
      <div id="hearts"></div>
      <div id="blockers"></div>
      <div id="throws"></div>
    </div>
    <div id="center">
      <div id="banner"></div>
      <div id="watch"><i id="watchBar"></i></div>
    </div>
    <div id="ammo"><div id="ammoLine"></div><div id="hint"></div></div>
  </div>
  <div id="topBtns">
    <button class="small" id="restartBtn" title="Restart level (R)">Restart</button>
    <button class="small" id="muteBtn" title="Toggle sound (M)">Sound: on</button>
  </div>
  <button id="hideBtn" aria-label="Hold to hide">HIDE<small>hold / space</small></button>
  <div id="overlay"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="game.js"></script>
</body>
</html>
