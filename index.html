<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Trash Panda Heist</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='26' fill='%238f99b2'/%3E%3Cellipse cx='32' cy='32' rx='22' ry='9' fill='%232b2d3d'/%3E%3Ccircle cx='22' cy='32' r='4' fill='%23fff'/%3E%3Ccircle cx='42' cy='32' r='4' fill='%23fff'/%3E%3C/svg%3E">
<meta name="description" content="Fling trash with a slingshot, dodge the night crew, and raid the dumpster.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1230;
    --panel: #1c1838;
    --ink: #0d0a18;
    --paper: #f4ecdf;
    --gold: #f2c14e;
    --red: #ef5b4c;
    --green: #3fa66a;
    --violet: #b08cff;
    --display: "Luckiest Guy", "Trebuchet MS", sans-serif;
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--paper);
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #wrap { position: fixed; inset: 0; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #game:active { cursor: grabbing; }

  .ink { border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #status {
    position: absolute; top: calc(10px + var(--sat)); left: calc(10px + var(--sal)); padding: 7px 12px; border-radius: 12px;
    background: rgba(28, 24, 56, 0.88); font-size: clamp(11px, 1.3vw, 14px); line-height: 1.45; transform: rotate(-1deg);
  }
  #lvl { font-family: var(--display); font-size: clamp(14px, 1.8vw, 20px); color: var(--gold); letter-spacing: 0.5px; }
  #hearts { font-size: clamp(16px, 2vw, 22px); letter-spacing: 3px; color: var(--red); line-height: 1.1; text-shadow: 2px 2px 0 var(--ink); }
  #hearts .off { color: rgba(255, 255, 255, 0.2); text-shadow: none; }
  #center {
    position: absolute; top: calc(10px + var(--sat)); left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(40%, 420px);
  }
  #banner {
    font-family: var(--display); font-size: clamp(15px, 2.4vw, 28px); letter-spacing: 1px;
    padding: 4px 14px; border-radius: 10px; white-space: nowrap; visibility: hidden;
    border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  }
  #banner.warn { visibility: visible; background: var(--gold); color: #2a1d05; }
  #banner.danger { visibility: visible; background: var(--red); color: #fff; animation: pulse 0.35s infinite alternate; }
  #banner.safe { visibility: visible; background: var(--green); color: #fff; }
  #banner.calm { visibility: visible; background: var(--panel); color: var(--paper); }
  @keyframes pulse { to { transform: scale(1.07) rotate(-2deg); } }
  #watch { width: 100%; height: 11px; border-radius: 6px; background: var(--panel); border: 3px solid var(--ink); overflow: hidden; visibility: hidden; }
  #watch.on { visibility: visible; }
  #watchBar { display: block; height: 100%; width: 0; background: var(--red); }
  #ammo {
    position: absolute; bottom: calc(12px + var(--sab)); left: 50%; transform: translateX(-50%) rotate(0.5deg); text-align: center;
    padding: 6px 14px; border-radius: 12px; background: rgba(28, 24, 56, 0.88);
    font-size: clamp(11px, 1.3vw, 14px); line-height: 1.45; max-width: min(64%, 640px);
  }
  #ammo b { color: var(--gold); }
  #hint { opacity: 0.85; }
  #hint:empty { display: none; }

  #topBtns { position: absolute; top: calc(10px + var(--sat)); right: calc(10px + var(--sar)); display: flex; gap: 8px; }
  .icon {
    width: 42px; height: 42px; padding: 0; border-radius: 12px; display: grid; place-items: center; cursor: pointer;
    background: var(--panel); color: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  }
  .icon:hover { background: #2d2758; }
  .icon:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .icon[hidden] { display: none; }
  #muteBtn .x { display: none; }
  #muteBtn.off .x { display: inline; }
  #muteBtn.off .w { display: none; }
  #hideBtn {
    position: absolute; left: calc(14px + var(--sal)); bottom: calc(14px + var(--sab));
    width: clamp(72px, 9vw, 108px); height: clamp(72px, 9vw, 108px); border-radius: 50%;
    background: var(--green); color: #fff; border: 4px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    font-family: var(--display); font-size: clamp(16px, 2vw, 24px); letter-spacing: 1px;
    cursor: pointer; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  }
  #hideBtn small { font: 600 10px system-ui, sans-serif; opacity: 0.85; margin-top: 4px; letter-spacing: 0; }
  #hideBtn .touch { display: none; }
  @media (pointer: coarse) { #hideBtn .touch { display: inline; } #hideBtn .kb { display: none; } }
  #hideBtn.active { background: var(--gold); color: #2a1d05; transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  #rotate {
    display: none; position: absolute; left: 50%; top: calc(170px + var(--sat)); transform: translateX(-50%);
    padding: 6px 12px; border-radius: 10px; background: var(--violet); color: var(--ink); font-weight: 700; font-size: 13px;
    border: 3px solid var(--ink); white-space: nowrap; pointer-events: none;
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
  @media (max-width: 640px) {
    #status { max-width: calc(100% - 224px - var(--sal) - var(--sar)); }
    #lvl { font-size: 13px; }
    #center { top: calc(118px + var(--sat)); width: 86%; }
    #ammo { max-width: calc(100% - 120px); left: calc(50% + 46px); }
  }
  @media (max-height: 480px) {
    #hint { display: none; }
    #status { padding: 4px 9px; line-height: 1.3; }
    #ammo { padding: 4px 10px; bottom: calc(8px + var(--sab)); }
    .icon { width: 38px; height: 38px; }
  }

  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(8, 6, 18, 0.55); padding: calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal));
  }
  #overlay.show { display: flex; }
  .panel {
    background: var(--panel); border: 4px solid var(--ink); box-shadow: 8px 8px 0 var(--ink), inset 0 0 0 3px var(--gold);
    border-radius: 20px; padding: clamp(14px, 2.4vw, 26px) clamp(16px, 3vw, 32px); max-width: min(600px, 100%);
    text-align: center; max-height: 100%; overflow: auto; transform: rotate(-0.6deg);
  }
  .panel h1 {
    font-family: var(--display); color: var(--gold); font-weight: 400; margin: 0 0 8px; letter-spacing: 1px;
    font-size: clamp(26px, 5vw, 54px); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink);
  }
  .panel p { margin: 6px 0; font-size: clamp(12px, 1.6vw, 16px); line-height: 1.45; }
  .panel .stars { font-size: clamp(26px, 4vw, 40px); color: var(--gold); letter-spacing: 6px; margin: 4px 0; text-shadow: 3px 3px 0 var(--ink); }
  .panel .stars .off { color: rgba(255, 255, 255, 0.18); text-shadow: none; }
  .panel .row { display: flex; gap: 12px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .panel button {
    font-family: var(--display); font-size: clamp(16px, 2vw, 22px); letter-spacing: 1px; padding: 10px 24px; border-radius: 12px;
    cursor: pointer; background: var(--gold); color: #2a1d05; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  }
  .panel button.alt { background: #3a3366; color: var(--paper); }
  .panel button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="Game view"></canvas>
  <div id="hud">
    <div id="status" class="ink">
      <div id="lvl"></div>
      <div id="hearts" aria-label="3 of 3 hearts"></div>
      <div id="blockers"></div>
      <div id="throws"></div>
    </div>
    <div id="center">
      <div id="banner" role="status"></div>
      <div id="watch"><i id="watchBar"></i></div>
    </div>
    <div id="ammo" class="ink"><div id="ammoLine"></div><div id="hint"></div></div>
    <div id="rotate">Turn your phone sideways for a bigger view</div>
  </div>
  <div id="topBtns">
    <button class="icon" id="pauseBtn" aria-label="Pause" aria-pressed="false" title="Pause (P)">
      <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
    </button>
    <button class="icon" id="restartBtn" aria-label="Restart level" title="Restart level (R)">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
    </button>
    <button class="icon" id="muteBtn" aria-label="Sound on" aria-pressed="false" title="Sound (M)">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
    <button class="icon" id="fsBtn" aria-label="Full screen" title="Full screen" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
  <button id="hideBtn" aria-label="Hold to hide">HIDE<small class="kb">hold / space</small><small class="touch">hold</small></button>
  <div id="overlay" class="show"><div class="panel"><h1>Trash Panda Heist</h1><p>Sneaking into the alley...</p></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script type="module" src="src/main.js"></script>
<script>
  setTimeout(function () {
    if (window.__tphReady) return;
    document.getElementById('overlay').innerHTML = '<div class="panel"><h1>Stuck in traffic</h1><p>The game could not load its 3D engine. Check your connection, or try a browser with WebGL turned on, then reload.</p></div>';
  }, 20000);
</script>
</body>
</html>
